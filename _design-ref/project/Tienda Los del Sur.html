<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tienda Los del Sur — UI completa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    html, body { margin: 0; padding: 0; background: #f0eee9; font-family: "Inter", system-ui, sans-serif; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="data.js"></script>
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="storefront.jsx"></script>
  <script type="text/babel" src="admin.jsx"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const MW = 390, MH = 844;   // mobile artboard
    const DW = 1280, DH = 800;  // desktop artboard

    function App() {
      return (
        <DesignCanvas>
          <DCSection id="storefront" title="Storefront — pública (mobile)" subtitle="7 pantallas que ve el cliente desde el celular">
            <DCArtboard id="home" label="01 · Catálogo" width={MW} height={MH}>
              <ScreenHome />
            </DCArtboard>
            <DCArtboard id="card" label="02 · Tarjeta de producto" width={MW} height={MH}>
              <ScreenCardSpec />
            </DCArtboard>
            <DCArtboard id="detail" label="03 · Detalle de producto" width={MW} height={MH}>
              <ScreenProductDetail />
            </DCArtboard>
            <DCArtboard id="cart" label="04 · Carrito" width={MW} height={MH}>
              <ScreenCart />
            </DCArtboard>
            <DCArtboard id="cart-empty" label="04b · Carrito vacío" width={MW} height={MH}>
              <ScreenCartEmpty />
            </DCArtboard>
            <DCArtboard id="checkout" label="05 · Checkout" width={MW} height={MH}>
              <ScreenCheckout />
            </DCArtboard>
            <DCArtboard id="nequi" label="06 · Pago Nequi" width={MW} height={MH}>
              <ScreenNequi />
            </DCArtboard>
            <DCArtboard id="confirm" label="07 · Confirmación" width={MW} height={MH}>
              <ScreenConfirm />
            </DCArtboard>
          </DCSection>

          <DCSection id="admin" title="Admin dashboard — privado (desktop)" subtitle="7 pantallas para el equipo">
            <DCArtboard id="login" label="08 · Login" width={DW} height={DH}>
              <ScreenLogin />
            </DCArtboard>
            <DCArtboard id="dashboard" label="09 · Dashboard" width={DW} height={DH}>
              <ScreenDashboard />
            </DCArtboard>
            <DCArtboard id="products" label="10 · Productos" width={DW} height={DH}>
              <ScreenProducts />
            </DCArtboard>
            <DCArtboard id="product-form" label="11 · Nuevo producto" width={DW} height={DH}>
              <ScreenProductForm />
            </DCArtboard>
            <DCArtboard id="orders" label="12 · Pedidos" width={DW} height={DH}>
              <ScreenOrders />
            </DCArtboard>
            <DCArtboard id="order-detail" label="13 · Detalle de pedido" width={DW} height={DH}>
              <ScreenOrderDetail />
            </DCArtboard>
            <DCArtboard id="settings" label="14 · Ajustes" width={DW} height={DH}>
              <ScreenSettings />
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
